# Build the static site and publish dist/ to Hostinger over FTP on every push
# to main (or manually from the Actions tab). The VITE_* values are baked into
# the bundle at build time — set them and the FTP_* credentials in the repo's
# GitHub Secrets (Settings → Secrets and variables → Actions).
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys interleave their FTP syncs.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy every function under supabase/functions/ so a new or renamed
      # function can never be silently left undeployed (which surfaces to users
      # as "could not reach the service" — the endpoint 404s). Each directory
      # there is one function; its name is the directory name.
      - name: Deploy all Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            # Skip helper directories that aren't deployable functions.
            case "$name" in
              _shared|_*) echo "Skipping $name (shared/helper dir)"; continue ;;
            esac
            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref ptditjhezxiwdeqqoezc
            echo "::endgroup::"
          done

      - name: Skip Edge Function deploy
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "SUPABASE_ACCESS_TOKEN is not configured, so the Edge Functions were not deployed."
          echo "Set the SUPABASE_ACCESS_TOKEN repo secret to enable automatic function deploys."

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # PostHog's phc_ token is public (it ships in the browser bundle), so
          # it may live in repo Variables OR Secrets — accept whichever is set.
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN || secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || secrets.VITE_POSTHOG_HOST }}

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          # The main Hostinger FTP account lands in the home directory and the
          # live site is served from the public_html subfolder, so publish there.
          server-dir: public_html/
