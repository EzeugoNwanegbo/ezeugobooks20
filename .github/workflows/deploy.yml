# CI for pushes to main (or manual runs from the Actions tab):
#   1. deploy-edge-functions - publishes every Supabase Edge Function.
#   2. build-and-deploy      - builds the static site as a sanity check.
#
# NOTE ON PRODUCTION HOSTING: gd1.online is NOT published by this workflow.
# Hostinger's own GitHub auto-deployment (configured in hPanel) rebuilds the
# repo on every push and serves the SSR app (server.mjs + dist/server) - the
# live site updates within ~2 minutes of a push regardless of this workflow.
# This workflow used to also FTP the static dist/ into public_html/, but those
# files are never served (LiteSpeed routes requests to the Node SSR app), and
# the upload raced Hostinger's own deploy of the same push, which kept killing
# the transfer mid-flight with "FTPError: 550 <file>: No such file or
# directory" / ".in.<file> rename failed". The FTP step was removed for that
# reason - do not re-add it while Hostinger's Git deployment is active.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two runs of this workflow interleave.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploy every function under supabase/functions/ so a new or renamed
      # function can never be silently left undeployed (which surfaces to users
      # as "could not reach the service" — the endpoint 404s). Each directory
      # there is one function; its name is the directory name.
      - name: Deploy all Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            # Skip helper directories that aren't deployable functions.
            case "$name" in
              _shared|_*) echo "Skipping $name (shared/helper dir)"; continue ;;
            esac
            echo "::group::Deploying $name"
            supabase functions deploy "$name" --project-ref ptditjhezxiwdeqqoezc
            echo "::endgroup::"
          done

      - name: Skip Edge Function deploy
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "SUPABASE_ACCESS_TOKEN is not configured, so the Edge Functions were not deployed."
          echo "Set the SUPABASE_ACCESS_TOKEN repo secret to enable automatic function deploys."

  # Build-only CI check. Production is built and served by Hostinger's GitHub
  # auto-deployment (see the note at the top of this file); this job just
  # proves the static build still compiles with production env values.
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:static
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # PostHog's phc_ token is public (it ships in the browser bundle), so
          # it may live in repo Variables OR Secrets — accept whichever is set.
          # src/lib/analytics.ts also carries the production token as a
          # fallback, so builds without these vars still report analytics.
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN || secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || secrets.VITE_POSTHOG_HOST }}

      # Verify the produced bundle actually contains the PostHog token — this
      # is what proves analytics will work in any build made from this commit.
      - name: Assert PostHog token is baked into the bundle
        run: |
          if grep -rlaq 'phc_[A-Za-z0-9]\{20,\}' dist/assets/; then
            echo "PostHog token found in built bundle."
          else
            echo "::error::No phc_ PostHog token found in dist/assets — analytics would be dead in this build."
            exit 1
          fi
